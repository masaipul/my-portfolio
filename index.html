<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saiful Rohman | Professional Photographer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav>
        <div class="logo">SAIFUL<span>ROHMAN</span></div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">Tentang</a></li>
            <li><a href="#projects">Project</a></li>
            <li><a href="#contact">Kontak</a></li>
        </ul>
        <div class="theme-toggle" id="theme-btn">
            <i class="fas fa-moon"></i>
        </div>
    </nav>

    <header id="home" class="hero">
        <div class="hero-content">
            <h1>Menangkap Esensi dalam <br><span>Satu Bingkai</span></h1>

            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1471341971476-ae15ff5dd4ea?q=80&w=1000" alt="Work 2">

            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1000" alt="Work 3">
                <div class="overlay"><span>Nature</span></div>
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=1000" alt="Work 4">

    <script src="script.js"></script>
